name: Sankhya Add-on

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      acao:
        description: "Operacao a executar"
        required: true
        default: build
        type: choice
        options:
          - build
          - deploy_homologacao
          - publish
      confirmar_publicacao:
        description: "Digite PUBLICAR para confirmar a publicacao"
        required: false
        default: ""
        type: string

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    env:
      ADDON_APP_KEY: ${{ secrets.ADDON_APP_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Validar credencial de build
        shell: bash
        run: |
          test -n "$ADDON_APP_KEY" || {
            echo "O secret ADDON_APP_KEY e obrigatorio para o build."
            exit 1
          }

      - name: Permitir execucao do Gradle Wrapper
        run: chmod +x gradlew

      - name: Build
        run: ./gradlew --no-daemon clean build

  deploy_homologacao:
    name: Deploy homologacao
    needs: build
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.acao == 'deploy_homologacao' && github.ref == 'refs/heads/main' }}
    runs-on: self-hosted
    environment: homologacao
    env:
      ADDON_APP_KEY: ${{ secrets.ADDON_APP_KEY }}
      WILDFLY_HOME: ${{ vars.WILDFLY_HOME }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Validar ambiente de homologacao
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:ADDON_APP_KEY)) {
            throw "O secret ADDON_APP_KEY e obrigatorio."
          }
          if ([string]::IsNullOrWhiteSpace($env:WILDFLY_HOME)) {
            throw "A variavel de ambiente WILDFLY_HOME nao foi configurada."
          }
          if (-not (Test-Path (Join-Path $env:WILDFLY_HOME 'standalone\deployments'))) {
            throw "WILDFLY_HOME nao aponta para uma instalacao WildFly valida."
          }
          if (-not (Get-Process java -ErrorAction SilentlyContinue)) {
            throw "Nenhum processo Java/WildFly foi encontrado no runner de homologacao."
          }

      - name: Deploy local no WildFly
        shell: pwsh
        run: .\gradlew.bat --no-daemon clean deployAddon

  publish:
    name: Publicacao
    needs: build
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.acao == 'publish' && inputs.confirmar_publicacao == 'PUBLICAR' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    environment: publicacao
    env:
      ADDON_APP_KEY: ${{ secrets.ADDON_APP_KEY }}
      ORG_GRADLE_PROJECT_email: ${{ secrets.SANKHYA_EMAIL }}
      ORG_GRADLE_PROJECT_password: ${{ secrets.SANKHYA_PASSWORD }}
      SANKHYA_PRIVATE_KEY: ${{ secrets.SANKHYA_PRIVATE_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Validar secrets de publicacao
        shell: bash
        run: |
          test -n "$ADDON_APP_KEY" || { echo "ADDON_APP_KEY ausente."; exit 1; }
          test -n "$ORG_GRADLE_PROJECT_email" || { echo "SANKHYA_EMAIL ausente."; exit 1; }
          test -n "$ORG_GRADLE_PROJECT_password" || { echo "SANKHYA_PASSWORD ausente."; exit 1; }
          test -n "$SANKHYA_PRIVATE_KEY" || { echo "SANKHYA_PRIVATE_KEY ausente."; exit 1; }

      - name: Validar versao do add-on
        shell: bash
        run: |
          version="$(sed -nE "s/^[[:space:]]*version[[:space:]]*=[[:space:]]*[\"']([^\"']+)[\"'].*/\1/p" build.gradle | head -n 1)"
          test -n "$version" || { echo "A versao do add-on nao foi encontrada em build.gradle."; exit 1; }
          test "$version" != "unspecified" || { echo "A versao do add-on esta como unspecified."; exit 1; }
          echo "Versao do add-on: $version"

      - name: Permitir execucao do Gradle Wrapper
        run: chmod +x gradlew

      - name: Criar chave privada temporaria
        id: private-key
        shell: bash
        run: |
          key_file="$(mktemp)"
          printf '%s' "$SANKHYA_PRIVATE_KEY" > "$key_file"
          chmod 600 "$key_file"
          echo "SANKHYA_PRIVATE_KEY_PATH=$key_file" >> "$GITHUB_ENV"

      - name: Publicar manualmente
        run: ./gradlew --no-daemon clean publishAddon -PprivateKey="$SANKHYA_PRIVATE_KEY_PATH"

      - name: Remover chave privada temporaria
        if: ${{ always() && steps.private-key.outcome != 'skipped' }}
        shell: bash
        run: |
          if [ -n "${SANKHYA_PRIVATE_KEY_PATH:-}" ]; then
            rm -f -- "$SANKHYA_PRIVATE_KEY_PATH"
          fi
